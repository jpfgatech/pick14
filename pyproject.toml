[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pick14"
version = "0.1.0"
description = "Pick14 poker-style game engine and CLI"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.34"]
rl = ["gymnasium>=0.29", "numpy>=1.26", "torch>=2.2", "matplotlib>=3.8"]

[project.scripts]
pick14 = "pick14.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pick14*"]

[tool.setuptools.package-data]
pick14 = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
